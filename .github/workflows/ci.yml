name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./cmd/sdlc

      # git is needed by internal/engine's end-to-end test; the SQLite driver is pure Go
      # (modernc.org/sqlite), so no cgo toolchain is required on any runner.
      - name: go test
        run: go test ./... -race
